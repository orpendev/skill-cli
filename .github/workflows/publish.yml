name: publish

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
          cache: npm

      - run: npm ci

      - name: Verify version matches tag
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "package.json version ($PKG_VERSION) does not match tag ($TAG_VERSION)" >&2
            exit 1
          fi

      - run: npm run typecheck
      - run: npm run build

      # Trusted publishing (OIDC): auth comes from the GitHub Actions identity
      # registered as a trusted publisher on npmjs.com — no NPM_TOKEN secret.
      # Requires npm >= 11.5.1 (Node 22 bundles npm 10.x, so upgrade first).
      - run: npm install -g npm@latest

      - name: Publish to npm with provenance
        run: npm publish --provenance --access public
